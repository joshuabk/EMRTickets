{% extends 'base.html' %}
{% block title %}All Requests &middot; EMR Change Requests{% endblock %}

{% block content %}
{% if user.is_authenticated %}
  <div class="page-head">
    <h2 class="page-title">All Requests</h2>
    <a class="btn btn-outline-primary btn-sm" href="{% url 'showActiveRequests' %}">View pending only</a>
  </div>
  {% include 'requestTable.html' %}
{% else %}
  <div class="card login-card">
    <div class="card-body text-center py-5">
      <h2 class="page-title mb-3">EMR Team sign-in required</h2>
      <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
    </div>
  </div>
{% endif %}
{% endblock %}
